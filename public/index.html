<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Avorni Coffee — Sistem Kasir & Point of Sale">
  <title>Avorni Coffee — Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c8973e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 2v2'/><path d='M14 2v2'/><path d='M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z'/><path d='M6 2v2'/><path d='M17 12h1a3 3 0 0 1 0 6h-1'/></svg>">
</head>
<body>
  <!-- Animated Background -->
  <div class="login-bg">
    <div class="bg-grain"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>
    <div class="floating-beans">
      <span class="bean" style="--x: 10%; --delay: 0s; --duration: 12s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z"/><path d="M6 2v2"/><path d="M17 12h1a3 3 0 0 1 0 6h-1"/></svg></span>
      <span class="bean" style="--x: 25%; --delay: 2s; --duration: 15s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.15 4.9a6 6 0 0 1 8.95 8.95L13.5 19.5a6 6 0 0 1-8.95-8.95Z"/><path d="M10 6c0 1.5 1.5 3 3.5 3.5s3.5-.5 3.5-2"/></svg></span>
      <span class="bean" style="--x: 40%; --delay: 4s; --duration: 10s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z"/><path d="M6 2v2"/><path d="M17 12h1a3 3 0 0 1 0 6h-1"/></svg></span>
      <span class="bean" style="--x: 60%; --delay: 1s; --duration: 14s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.15 4.9a6 6 0 0 1 8.95 8.95L13.5 19.5a6 6 0 0 1-8.95-8.95Z"/><path d="M10 6c0 1.5 1.5 3 3.5 3.5s3.5-.5 3.5-2"/></svg></span>
      <span class="bean" style="--x: 75%; --delay: 3s; --duration: 11s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z"/><path d="M6 2v2"/><path d="M17 12h1a3 3 0 0 1 0 6h-1"/></svg></span>
      <span class="bean" style="--x: 90%; --delay: 5s; --duration: 13s; color: var(--brand-primary);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.15 4.9a6 6 0 0 1 8.95 8.95L13.5 19.5a6 6 0 0 1-8.95-8.95Z"/><path d="M10 6c0 1.5 1.5 3 3.5 3.5s3.5-.5 3.5-2"/></svg></span>
    </div>
  </div>

  <!-- Login Card -->
  <main class="login-container">
    <div class="login-card animate-scaleIn" id="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon" style="color: var(--brand-primary); display: inline-block;"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h12Z"/><path d="M6 2v2"/><path d="M17 12h1a3 3 0 0 1 0 6h-1"/></svg></div>
        <h1 class="logo-text">Avorni<span>Coffee</span></h1>
        <p class="logo-tagline">Point of Sale System</p>
      </div>

      <!-- Role Selection -->
      <div class="role-section" id="role-section">
        <p class="section-label">Masuk sebagai</p>
        <div class="role-cards">
          <button class="role-card" data-role="admin" id="role-admin">
            <div class="role-icon" style="color: var(--brand-primary);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14a1 1 0 0 0 1-1v-1H4v1a1 1 0 0 0 1 1z"/></svg></div>
            <div class="role-name">Kasir & Admin</div>
            <div class="role-desc">Kelola menu, transaksi & pembayaran</div>
          </button>
          <button class="role-card" data-role="dapur" id="role-dapur">
            <div class="role-icon" style="color: var(--brand-primary);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V6a4 4 0 0 1 8 0v12"/><path d="M18 18V9a4 4 0 0 0-8 0v9"/><path d="M3 18h18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg></div>
            <div class="role-name">Dapur</div>
            <div class="role-desc">Terima & proses pesanan masuk</div>
          </button>
          <button class="role-card" data-role="pelayan" id="role-pelayan">
            <div class="role-icon" style="color: var(--brand-primary);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            <div class="role-name">Pelayan</div>
            <div class="role-desc">Ambil pesanan pelanggan</div>
          </button>
        </div>
      </div>

      <!-- Login Form (shown after role selected) -->
      <form class="login-form hidden" id="login-form" autocomplete="off">
        <button type="button" class="back-btn" id="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Kembali
        </button>

        <div class="selected-role" id="selected-role-display">
          <span class="selected-role-icon" id="selected-icon" style="color: var(--brand-primary); display: inline-flex; align-items: center; justify-content: center;"></span>
          <span class="selected-role-name" id="selected-name">Kasir & Admin</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-input" placeholder="Masukkan password" required>
            <button type="button" class="password-toggle" id="toggle-pw" aria-label="Tampilkan password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="error-msg hidden" id="error-msg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="error-text">Username atau password salah</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn">
          Masuk
        </button>
      </form>

      <!-- Version -->
      <div class="login-footer">
        <span>Avorni Coffee POS v1.0</span>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // --- Login Page Logic ---
    const roleSection = document.getElementById('role-section');
    const loginForm = document.getElementById('login-form');
    const backBtn = document.getElementById('back-btn');
    const loginCard = document.getElementById('login-card');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const togglePw = document.getElementById('toggle-pw');
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');

    let selectedRole = null;

    // Role card selection
    document.querySelectorAll('.role-card').forEach((card) => {
      card.addEventListener('click', () => {
        selectedRole = card.dataset.role;

        // Update display
        document.getElementById('selected-icon').innerHTML = card.querySelector('.role-icon').innerHTML;
        document.getElementById('selected-name').textContent = card.querySelector('.role-name').textContent;

        // Auto-fill username based on role
        const defaultUsernames = { admin: 'admin', dapur: 'dapur', pelayan: 'pelayan' };
        usernameInput.value = defaultUsernames[selectedRole] || '';

        // Show form
        roleSection.classList.add('hidden');
        loginForm.classList.remove('hidden');
        errorMsg.classList.add('hidden');

        // Focus password since username is pre-filled
        setTimeout(() => passwordInput.focus(), 300);
      });
    });

    // Back button
    backBtn.addEventListener('click', () => {
      loginForm.classList.add('hidden');
      roleSection.classList.remove('hidden');
      selectedRole = null;
      usernameInput.value = '';
      passwordInput.value = '';
      errorMsg.classList.add('hidden');
    });

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePw.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Tampilkan password');
    });

    // Login form submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        errorText.textContent = 'Mohon isi username dan password';
        errorMsg.classList.remove('hidden');
        return;
      }

      // Disable button during login
      const loginBtn = document.getElementById('login-btn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Memproses...';

      const session = await auth.login(username, password);

      loginBtn.disabled = false;
      loginBtn.textContent = 'Masuk';

      if (!session) {
        errorText.textContent = 'Username atau password salah';
        errorMsg.classList.remove('hidden');
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      // Check if role matches
      if (session.role !== selectedRole) {
        errorText.textContent = 'Akun ini bukan untuk role ' + selectedRole;
        errorMsg.classList.remove('hidden');
        sessionStorage.removeItem('avorni_session');
        return;
      }

      // Redirect based on role
      const redirects = {
        admin: 'admin.html',
        dapur: 'dapur.html',
        pelayan: 'pelayan.html',
      };

      window.location.href = redirects[session.role] || 'index.html';
    });

    // If already logged in, redirect
    const currentUser = auth.getCurrentUser();
    if (currentUser) {
      const redirects = { admin: 'admin.html', dapur: 'dapur.html', pelayan: 'pelayan.html' };
      if (redirects[currentUser.role]) {
        window.location.href = redirects[currentUser.role];
      }
    }
  </script>
</body>
</html>
