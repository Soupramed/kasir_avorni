<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Avorni Coffee — Kitchen Display System">
  <title>Dapur — Avorni Coffee</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dapur.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c8973e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 18V6a4 4 0 0 1 8 0v12'/><path d='M18 18V9a4 4 0 0 0-8 0v9'/><path d='M3 18h18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z'/></svg>">
</head>
<body>
  <!-- Top Bar -->
  <header class="kitchen-topbar">
    <div class="topbar-left">
      <span class="topbar-logo" style="color: var(--brand-primary); display: inline-flex; align-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V6a4 4 0 0 1 8 0v12"/><path d="M18 18V9a4 4 0 0 0-8 0v9"/><path d="M3 18h18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg></span>
      <h1 class="topbar-title">Dapur <span>Avorni</span></h1>
    </div>
    <div class="topbar-center">
      <div class="kitchen-stats">
        <div class="kitchen-stat" id="stat-baru">
          <span class="kitchen-stat-count">0</span>
          <span class="kitchen-stat-label">Baru</span>
        </div>
        <div class="kitchen-stat" id="stat-proses">
          <span class="kitchen-stat-count">0</span>
          <span class="kitchen-stat-label">Proses</span>
        </div>
        <div class="kitchen-stat" id="stat-siap">
          <span class="kitchen-stat-count">0</span>
          <span class="kitchen-stat-label">Siap</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="notification-bell" id="notif-bell" title="Notifikasi" style="display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge hidden" id="notif-badge">0</span>
      </button>
      <span class="topbar-user" id="user-name">Staff Dapur</span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Keluar</button>
    </div>
  </header>

  <!-- Mobile Column Tab Switcher (visible only on small screens) -->
  <nav class="kitchen-col-tabs" id="kitchen-col-tabs">
    <button class="kitchen-col-tab active" data-col="baru">
      <span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;flex-shrink:0;"></span>
      Baru
      <span class="kitchen-col-tab-count" id="tab-count-baru">0</span>
    </button>
    <button class="kitchen-col-tab" data-col="proses">
      <span style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;flex-shrink:0;"></span>
      Diproses
      <span class="kitchen-col-tab-count" id="tab-count-proses">0</span>
    </button>
    <button class="kitchen-col-tab" data-col="siap">
      <span style="width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;flex-shrink:0;"></span>
      Siap
      <span class="kitchen-col-tab-count" id="tab-count-siap">0</span>
    </button>
  </nav>

  <!-- Kitchen Board -->
  <main class="kitchen-board">
    <!-- Column: Pesanan Baru -->
    <section class="kitchen-column" id="col-baru">
      <div class="column-header column-header-new">
        <h2 style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block;"></span> Pesanan Baru</h2>
        <span class="column-count" id="count-baru">0</span>
      </div>
      <div class="column-body" id="body-baru">
        <!-- Order cards rendered here -->
      </div>
    </section>

    <!-- Column: Sedang Diproses -->
    <section class="kitchen-column" id="col-proses">
      <div class="column-header column-header-process">
        <h2 style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span> Sedang Diproses</h2>
        <span class="column-count" id="count-proses">0</span>
      </div>
      <div class="column-body" id="body-proses">
        <!-- Order cards rendered here -->
      </div>
    </section>

    <!-- Column: Siap Disajikan -->
    <section class="kitchen-column" id="col-siap">
      <div class="column-header column-header-ready">
        <h2 style="display: inline-flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #10b981; display: inline-block;"></span> Siap Disajikan</h2>
        <span class="column-count" id="count-siap">0</span>
      </div>
      <div class="column-body" id="body-siap">
        <!-- Order cards rendered here -->
      </div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dapur.js?v=2"></script>
</body>
</html>
